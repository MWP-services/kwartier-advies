name: Build and deploy Next.js app to Azure Web App - kwartier

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install, test, and build
        run: |
          npm ci
          npm test -- --run tests/analysisJobClient.test.ts tests/analysisJobs.test.ts
          npm run build
          node --check scripts/start-webapp.js
          test -f .worker-build/worker/analysis-worker.js
          test -f scripts/start-webapp.js

      - name: Prepare standalone deployment package
        run: |
          mkdir -p deploy/.next
          cp -R .next/standalone/. deploy/
          mkdir -p deploy/.next/static deploy/public
          cp -R .next/static/. deploy/.next/static/
          cp -R public/. deploy/public/
          cp -R .worker-build deploy/.worker-build
          mkdir -p deploy/scripts
          cp scripts/start-webapp.js deploy/scripts/start-webapp.js
          node -e "const fs=require('fs'); const pkg=require('./deploy/package.json'); pkg.scripts={start:'node scripts/start-webapp.js'}; pkg.engines={node:'20.x'}; delete pkg.devDependencies; fs.writeFileSync('./deploy/package.json', JSON.stringify(pkg, null, 2));"
          test -f deploy/.worker-build/worker/analysis-worker.js
          test -f deploy/scripts/start-webapp.js
          cd deploy
          zip -qr ../next.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: next.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kwartier'
          slot-name: 'Production'
          package: next.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8EFE5BBAEF714E089D996EC59C7D964E }}
